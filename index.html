<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beef Aura Pro | 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; 
            --card: rgba(15, 23, 42, 0.7); 
            --text: #f8fafc; 
            --accent: #ff4d00; 
            --tech: #06b6d4; 
            --sales: #fbbf24; 
            --voice: #f472b6;
            --border: rgba(255, 255, 255, 0.08);
            --sidebar-width: 340px;
        }
        .theme-tech { --accent: var(--tech); }
        .theme-sales { --accent: var(--sales); }
        .theme-voice { --accent: var(--voice); }
        
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; color: var(--text); background: var(--bg);
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 77, 0, 0.1), transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(255, 153, 0, 0.05), transparent 40%);
            background-attachment: fixed;
        }

        .hero-section { display: flex; flex-direction: column; align-items: center; padding: 60px 20px 30px; }
        
        .meteor-logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .fire-core {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fff 0%, #ffcc00 30%, var(--accent) 70%);
            border-radius: 50%;
            box-shadow: 
                0 0 40px var(--accent),
                0 0 80px #ff9900,
                0 0 120px rgba(255, 77, 0, 0.4);
            animation: flicker 0.1s infinite alternate;
        }

        .main-letter {
            position: relative;
            z-index: 20;
            font-size: 75px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
            filter: drop-shadow(2px 2px 10px rgba(0,0,0,0.8));
            animation: float 3s ease-in-out infinite;
            user-select: none;
        }

        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffcc00;
            border-radius: 50%;
            filter: blur(1px);
            pointer-events: none;
            z-index: 15;
            animation: flyOut 1.5s linear infinite;
        }

        @keyframes flicker {
            from { transform: scale(1); opacity: 0.9; }
            to { transform: scale(1.08); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes flyOut {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        [dir="rtl"] .sidebar { right: -360px; left: auto; border-left: 1px solid var(--border); }
        [dir="rtl"] .sidebar.active { right: 0; }
        [dir="ltr"] .sidebar { left: -360px; right: auto; border-right: 1px solid var(--border); }
        [dir="ltr"] .sidebar.active { left: 0; }
        
        .sidebar {
            position: fixed; top: 0; width: var(--sidebar-width); height: 100%;
            background: rgba(10, 15, 25, 0.98); backdrop-filter: blur(35px);
            z-index: 3000; padding: 30px 20px; display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            overflow-y: auto;
        }

        header { background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); padding: 12px 0 0 0; }
        .nav-container { max-width: 1300px; margin: 0 auto; padding: 0 20px 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-nav { display: flex; gap: 8px; }
        .nav-item { cursor: pointer; padding: 8px 15px; border-radius: 12px; font-weight: 700; opacity: 0.4; font-size: 13px; border: 1px solid transparent; }
        .nav-item.active { opacity: 1; background: rgba(255,255,255,0.05); color: var(--accent); border-color: var(--accent); }
        .lang-btn { background: var(--accent); color: #000; border: none; padding: 5px 12px; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 12px; margin: 0 10px; }

        /* الشريط الإضافي الجديد أسفل القائمة العلوية */
        .pro-sub-bar {
            border-top: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.45);
            padding: 8px 0;
        }
        .pro-sub-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pro-pill-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            user-select: none;
        }
        .pro-pill-btn:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }
        .pro-pill-btn.auto-active {
            background: rgba(0, 255, 170, 0.12);
            border-color: #00ffaa;
            color: #00ffaa;
            box-shadow: 0 0 12px rgba(0, 255, 170, 0.18);
        }
        .pro-pill-btn.normal-active {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
            color: var(--accent);
        }
        .pro-pill-btn.pip-highlight {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 900;
            box-shadow: 0 0 16px rgba(255, 77, 0, 0.25);
        }
        .pro-pill-btn.pip-highlight:hover {
            filter: brightness(1.1);
            color: #000;
        }
        
        .search-area { max-width: 1300px; margin: 20px auto; padding: 0 25px; position: relative; }
        .search-input { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 18px 30px; border-radius: 50px; color: #fff; outline: none; font-size: 16px; }
        .search-input:focus { border-color: var(--accent); }
        
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; padding: 20px 25px 100px; }
        .note-card { background: var(--card); border-radius: 25px; border: 1px solid var(--border); padding: 25px; height: 210px; display: flex; flex-direction: column; cursor: pointer; position: relative; backdrop-filter: blur(15px); }
        .note-card.pinned { border: 2px solid var(--accent); }
        .pin-icon { position: absolute; top: 15px; font-size: 18px; opacity: 0.2; }
        [dir="rtl"] .pin-icon { left: 15px; } [dir="ltr"] .pin-icon { right: 15px; }
        .pin-icon.active { opacity: 1; filter: drop-shadow(0 0 5px var(--accent)); }
        
        .note-card h4 { margin: 0 0 10px 0; color: var(--accent); font-size: 19px; }
        .note-card p { font-size: 14px; opacity: 0.7; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; line-height: 1.6; }
        
        .action-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #fff; padding: 14px 20px; border-radius: 16px; margin-bottom: 10px; cursor: pointer; font-weight: 600; font-family: inherit; font-size: 13px; }
        .action-btn:hover { background: var(--accent); color: #000; transform: translateY(-3px); }
        
        .fab { position: fixed; bottom: 30px; width: 75px; height: 75px; border-radius: 25px; background: var(--accent); color: #000; border: none; font-size: 40px; cursor: pointer; z-index: 100; box-shadow: 0 10px 30px rgba(255, 77, 0, 0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        [dir="rtl"] .fab { left: 30px; } [dir="ltr"] .fab { right: 30px; }
        
        #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 40px; border-radius: 50px; font-weight: 800; display: none; z-index: 5000; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 4000; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { background: #0f172a; width: 100%; max-width: 500px; padding: 35px; border-radius: 35px; border: 1px solid var(--border); }
        input, textarea, select { width: 100%; margin-bottom: 15px; padding: 15px; border-radius: 15px; background: #1e293b; color: #fff; border: 1px solid var(--border); font-family: inherit; }
        .gh-box { background: rgba(6, 182, 212, 0.06); border: 1px solid rgba(6, 182, 212, 0.25); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
        .gh-box input { padding: 8px 12px; margin-bottom: 8px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body class="theme-all">

<div id="toast">تم! ✅</div>

<aside id="sidebar" class="sidebar">
    <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border);">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center;">
            <div><span class="stat-val" id="stat-count" style="display: block; font-size: 20px; font-weight: 900; color: var(--accent);">0</span><span data-i18n="cards">كروت</span></div>
            <div><span class="stat-val" id="stat-copies" style="display: block; font-size: 20px; font-weight: 900; color: var(--accent);">0</span><span data-i18n="copies">نسخ</span></div>
        </div>
    </div>

    <div class="gh-box">
        <div style="font-size: 12px; font-weight: 800; color: var(--tech); margin-bottom: 8px;">🔐 إعدادات سحابة GitHub الآمنة</div>
        <input type="password" id="ghTokenInput" placeholder="GitHub Token (ghp_... / github_pat_...)" onchange="updateGhConfig()" />
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
            <input type="text" id="ghOwnerInput" placeholder="Owner (User)" style="margin-bottom:0;" onchange="updateGhConfig()" />
            <input type="text" id="ghRepoInput" placeholder="Repo Name" style="margin-bottom:0;" onchange="updateGhConfig()" />
        </div>
    </div>
    
    <button class="action-btn" style="background: rgba(6, 182, 212, 0.15); border-color: var(--tech);" onclick="saveToGitHub()"><span>☁️ رفع للسحابة (GitHub)</span></button>
    <button class="action-btn" style="background: rgba(6, 182, 212, 0.15); border-color: var(--tech);" onclick="loadFromGitHub()"><span>🔄 استرجاع من السحابة</span></button>
    <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0; width: 100%;">
    
    <button class="action-btn" onclick="openPopup('export')"><span>📤 <span data-i18n="export">تصدير الذكي</span></span></button>
    <button class="action-btn" onclick="openPopup('import')"><span>📥 <span data-i18n="import">استيراد</span></span></button>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="action-btn" onclick="undo()"><span>↩️ Undo</span></button>
        <button class="action-btn" onclick="redo()"><span>↪️ Redo</span></button>
    </div>
    <button class="action-btn" onclick="resetData()" style="color: #ff4d00;"><span>🗑️ <span data-i18n="reset">مسح الكل</span></span></button>
    <button class="action-btn" onclick="cycleTheme()"><span>🎨 <span data-i18n="theme">الثيم</span></span></button>
    <button class="action-btn" style="margin-top: auto;" onclick="toggleSidebar()"><span data-i18n="close">إغلاق</span></button>
</aside>

<header>
    <div class="nav-container">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 35px; height: 35px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color:#000;">H</div>
            <div style="font-weight: 900;" data-i18n="app-name">BEEF AURA</div>
            <button class="lang-btn" onclick="toggleLanguage()" id="langSwitcher">EN</button>
        </div>
        <div class="main-nav">
            <div class="nav-item active" id="nav-all" onclick="switchSection('all')" data-i18n="all">🌈 الكل</div>
            <div class="nav-item" id="nav-tech" onclick="switchSection('tech')">💻 Tech</div>
            <div class="nav-item" id="nav-sales" onclick="switchSection('sales')">🏷️ Sales</div>
            <div class="nav-item" id="nav-voice" onclick="switchSection('voice')">📞 Voice</div>
        </div>
        <button class="action-btn" style="width: auto; margin:0;" onclick="toggleSidebar()" data-i18n="settings">⚙️ الإعدادات</button>

    <!-- الشريط الجديد للإضافات في سطر مستقل أسفل القائمة العلوية -->
    <div class="pro-sub-bar">
        <div class="pro-sub-container">
            <button id="toggleWorkModeBtn" class="pro-pill-btn auto-active" onclick="toggleWorkMode()">
                <span id="workModeText">⚡ وضع النسخ التلقائي</span>
            </button>

            <button id="dockModeBtn" class="pro-pill-btn pip-highlight" onclick="launchPipWindow()">
                <span data-i18n="pip-btn">📌 تفعيل الوضع العائم المستقل</span>

            <label for="excelUpload" class="pro-pill-btn" style="cursor:pointer;">

            </label>

</header>

<section class="hero-section">
    <div class="meteor-logo-container" id="logoContainer">
        <div class="fire-core"></div>
        <div class="main-letter">H</div>
    </div>
    
    <h1 style="margin: 20px 0 5px 0; font-weight: 900; letter-spacing: -1px;" data-i18n="hero-title">Beef Aura Pro</h1>
    <p style="opacity: 0.5; font-size: 13px; margin: 0; font-weight: 600;" data-i18n="hero-sub">Moataz Atef Team | 2026</p>
</section>

<div class="search-area">
    <input type="text" id="searchInput" class="search-input" placeholder="ابحث بسرعة..." autocomplete="off">
</div>

<div class="notes-grid" id="notesGrid"></div>

<button class="fab" onclick="openModal()">+<span style="font-size:10px; font-weight:900; margin-top:-5px;">NEW</span></button>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 style="color:var(--accent); margin-top:0;" data-i18n="modal-title">إدارة الكرت</h2>
        <select id="mainCatSelect">
            <option value="tech">💻 Tech Section</option>
            <option value="sales">🏷️ Sales Section</option>

        <input id="noteTitle" placeholder="العنوان / كود الاختصار..." />

        <div style="display: flex; gap: 10px;">

            <button id="deleteBtn" class="action-btn" style="background:#ef4444; display:none; width: auto;" onclick="deleteNote(editingId)">🗑️</button>
            <button class="action-btn" onclick="closeModal()" style="width: auto;"><span data-i18n="cancel">إلغاء</span></button>

</div>

<div class="modal" id="popupModal">
    <div class="modal-content">
        <h2 id="popupTitle" style="color:var(--accent)">خيارات التصدير</h2>
        <div id="popupOptions"></div>
        <button class="action-btn" style="margin-top:20px;" onclick="closePopup()" data-i18n="close">إغلاق</button>
    </div>
</div>

<input type="file" id="fileInput" hidden onchange="handleFileImport(event)">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
    // =============================================================
    // ⚙️ إعدادات GITHUB - يتم قراءتها وحفظها بأمان في localStorage فقط
    // =============================================================
    const GH_CONFIG = {
        token: localStorage.getItem('aura_gh_token') || '',
        owner: localStorage.getItem('aura_gh_owner') || 'A25-cmd',
        repo: localStorage.getItem('aura_gh_repo') || 'beef-aura',
        path: 'backup.json'
    };

    function initGhInputs() {
        const tEl = document.getElementById('ghTokenInput');
        const oEl = document.getElementById('ghOwnerInput');
        const rEl = document.getElementById('ghRepoInput');
        if (tEl) tEl.value = GH_CONFIG.token;
        if (oEl) oEl.value = GH_CONFIG.owner;
        if (rEl) rEl.value = GH_CONFIG.repo;
    }

    function updateGhConfig() {
        GH_CONFIG.token = (document.getElementById('ghTokenInput')?.value || '').trim();
        GH_CONFIG.owner = (document.getElementById('ghOwnerInput')?.value || '').trim() || 'A25-cmd';
        GH_CONFIG.repo = (document.getElementById('ghRepoInput')?.value || '').trim() || 'beef-aura';
        localStorage.setItem('aura_gh_token', GH_CONFIG.token);
        localStorage.setItem('aura_gh_owner', GH_CONFIG.owner);
        localStorage.setItem('aura_gh_repo', GH_CONFIG.repo);
        showToast('تم حفظ إعدادات GitHub محلياً بأمان 🔐');
    }

    const i18n = {
        ar: {
            "app-name": "BEEF AURA", "all": "🌈 الكل", "settings": "⚙️ الإعدادات", "cards": "كروت", "copies": "نسخ",
            "export": "تصدير الذكي", "import": "استيراد", "reset": "مسح الكل", "theme": "الثيم",
            "close": "إغلاق", "hero-title": "Beef Aura Pro", "hero-sub": "Moataz Atef Team | 2026",
            "search": "ابحث بسرعة أو اكتب كود الاختصار...", "modal-title": "إدارة الكرت", "save": "حفظ", "cancel": "إلغاء",
            "toast-copy": "تم النسخ! 🔥",
            "mode-auto": "⚡ وضع النسخ التلقائي",
            "mode-normal": "🖱️ الوضع العادي",
            "pip-btn": "📌 تفعيل الوضع العائم المستقل",
            "import-excel": "📂 استيراد Excel"
        },
        en: {
            "app-name": "BEEF AURA", "all": "🌈 All", "settings": "⚙️ Settings", "cards": "Cards", "copies": "Copies",
            "export": "Smart Export", "import": "Import", "reset": "Reset All", "theme": "Theme",
            "close": "Close", "hero-title": "Beef Aura Pro", "hero-sub": "Moataz Atef Team | 2026",
            "search": "Fast Search or type trigger...", "modal-title": "Manage Card", "save": "Save", "cancel": "Cancel",
            "toast-copy": "Copied! 🔥",
            "mode-auto": "⚡ Auto-Copy Mode",
            "mode-normal": "🖱️ Normal Mode",
            "pip-btn": "📌 Floating PiP HUD",
            "import-excel": "📂 Import Excel"
        }
    };

    let notes = JSON.parse(localStorage.getItem('beef_aura_ultimate_26') || '[]');
    let history = [JSON.stringify(notes)];
    let historyStep = 0;
    let copyTotal = parseInt(localStorage.getItem('aura_copy_counter_26') || '0');
    let currentView = 'all', editingId = null, currentLang = localStorage.getItem('aura_lang') || 'ar';
    let AUTO_COPY_MODE = localStorage.getItem('aura_auto_copy_mode') !== 'false';
    let searchDebounce = null;
    let activePipWin = null;
    let activeCustomerVar = localStorage.getItem('aura_customer_var') || '';

    function normalizeKey(str) {
        return (str || '').toString().trim().toLowerCase().replace(/^[#\/]/, '');
    }

    // معالجة المتغيرات الذكية {name} و {num} قبل النسخ
    function resolveSmartPlaceholders(rawText, overrideVar) {
        const val = (overrideVar !== undefined ? overrideVar : activeCustomerVar).trim();
        if (!val) return rawText;
        return rawText
            .replace(/\{name\}|\{الاسم\}/gi, val)
            .replace(/\{num\}|\{number\}|\{الرقم\}/gi, val);
    }

    // تنبيه صوتي خفيف عبر Web Audio API دون أي ملفات خارجية
    function playGentleBeep(freq = 880, durationMs = 140, count = 1) {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            for (let i = 0; i < count; i++) {
                const startAt = ctx.currentTime + i * (durationMs / 1000 + 0.08);
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startAt);
                gain.gain.setValueAtTime(0.06, startAt);
                gain.gain.exponentialRampToValueAtTime(0.0001, startAt + durationMs / 1000);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startAt);
                osc.stop(startAt + durationMs / 1000);
            }
        } catch (e) {}
    }

    function createSparks() {
        const container = document.getElementById('logoContainer');
        if(!container) return;
        for(let i=0; i<6; i++) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            const x = (Math.random() - 0.5) * 250 + 'px';
            const y = (Math.random() - 0.5) * 250 + 'px';
            spark.style.setProperty('--x', x);
            spark.style.setProperty('--y', y);
            spark.style.left = '50%';
            spark.style.top = '50%';
            container.appendChild(spark);
            setTimeout(() => spark.remove(), 1500);
        }
    }
    setInterval(createSparks, 250);

    // =============================================================
    // ⚡ التحكم في وضعي التشغيل (النسخ التلقائي vs الوضع العادي)
    // =============================================================
    function updateWorkModeUI() {
        const btn = document.getElementById('toggleWorkModeBtn');
        const txt = document.getElementById('workModeText');
        if (!btn || !txt) return;
        if (AUTO_COPY_MODE) {
            btn.className = 'pro-pill-btn auto-active';
            txt.innerText = i18n[currentLang]["mode-auto"];
        } else {
            btn.className = 'pro-pill-btn normal-active';
            txt.innerText = i18n[currentLang]["mode-normal"];
        }

    function saveToHistory() {
        const state = JSON.stringify(notes);
        if (state !== history[historyStep]) {
            history = history.slice(0, historyStep + 1);
            history.push(state);
            historyStep++;
        }
    }

    function undo() { if (historyStep > 0) { historyStep--; notes = JSON.parse(history[historyStep]); saveAndRender(); showToast("Undo ↩️"); } }
    function redo() { if (historyStep < history.length - 1) { historyStep++; notes = JSON.parse(history[historyStep]); saveAndRender(); showToast("Redo ↪️"); } }

    function saveAndRender(autoSync = true) {
        localStorage.setItem('beef_aura_ultimate_26', JSON.stringify(notes));
        render();
        if (activePipWin && !activePipWin.closed && typeof activePipWin.__refreshHudMacros === 'function') {
            activePipWin.__refreshHudMacros();
        }
        if(autoSync && GH_CONFIG.token) saveToGitHub(true);
    }

    async function copyCardContent(content, customToast, overrideVar) {
        const finalContent = resolveSmartPlaceholders(content, overrideVar);
        try {
            await navigator.clipboard.writeText(finalContent);
        } catch(e) {
            const area = document.createElement('textarea');
            area.value = finalContent;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);
        }
        copyTotal++;
        localStorage.setItem('aura_copy_counter_26', copyTotal);
        document.getElementById('stat-copies').innerText = copyTotal;
        showToast(customToast || i18n[currentLang]["toast-copy"]);
    }

    function render() {
        const grid = document.getElementById('notesGrid');
        const rawQuery = document.getElementById('searchInput').value;
        const query = rawQuery.toLowerCase();
        grid.innerHTML = '';
        const sorted = [...notes].sort((a,b) => (a.pinned === b.pinned) ? b.id - a.id : (a.pinned ? -1 : 1));
        const filtered = sorted.filter(n => (currentView === 'all' || n.main === currentView) && (n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query)));
        
        document.getElementById('stat-count').innerText = notes.length;
        document.getElementById('stat-copies').innerText = copyTotal;

        filtered.forEach(n => {
            const card = document.createElement('div');
            card.className = `note-card ${n.pinned ? 'pinned' : ''}`;
            card.style.borderTop = `5px solid var(--${n.main})`;
            card.onclick = () => copyCardContent(n.content);
            card.ondblclick = () => openModal(n.id);
            card.innerHTML = `<div class="pin-icon ${n.pinned ? 'active' : ''}" onclick="togglePin(event, ${n.id})">📌</div><h4>${n.title}</h4><p>${n.content}</p>`;
            grid.appendChild(card);
        });
    }

    // البحث + النسخ التلقائي عند مطابقة كود الاختصار
    document.getElementById('searchInput').addEventListener('input', () => {
        if (searchDebounce) clearTimeout(searchDebounce);
        render();

        const rawVal = document.getElementById('searchInput').value.trim();
        const searchVal = normalizeKey(rawVal);

        if (AUTO_COPY_MODE && searchVal.length > 0) {
            searchDebounce = setTimeout(() => {
                const scopePool = currentView === 'all' ? notes : notes.filter(n => n.main === currentView);
                const match = scopePool.find(n => normalizeKey(n.title) === searchVal) || notes.find(n => normalizeKey(n.title) === searchVal);

                if (match && normalizeKey(document.getElementById('searchInput').value) === normalizeKey(match.title)) {
                    copyCardContent(match.content, `⚡ تم النسخ التلقائي: ${match.title}`);
                    document.getElementById('searchInput').value = '';
                    render();
                }
            }, 450);
        }
    });

        const title = document.getElementById('noteTitle').value || 'Untitled';
        const content = document.getElementById('noteBody').value;
        const main = document.getElementById('mainCatSelect').value;

    // 📊 استيراد ملفات Excel (.xlsx / .xls)
    // =============================================================
    function handleExcelImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                let added = 0;
                const targetSec = currentView === 'all' ? 'tech' : currentView;
                rows.forEach(r => {
                    const keys = Object.keys(r);
                    const kField = keys.find(k => /^(keyword|code|title|اختصار|مفتاح|العنوان)$/i.test(k.trim())) || keys[0];
                    const tField = keys.find(k => /^(text|phrase|snippet|content|العبارة|النص|المحتوى)$/i.test(k.trim())) || keys[1];
                    const sField = keys.find(k => /^(section|category|main|القسم)$/i.test(k.trim()));
                    const kw = kField ? String(r[kField]).trim() : '';
                    const txt = tField ? String(r[tField]).trim() : '';
                    const secRaw = sField ? String(r[sField]).trim().toLowerCase() : targetSec;
                    const sec = ['tech', 'sales', 'voice'].includes(secRaw) ? secRaw : targetSec;
                    if (kw && txt && !notes.some(x => normalizeKey(x.title) === normalizeKey(kw))) {
                        notes.push({ id: Date.now() + Math.random(), title: kw, content: txt, main: sec, pinned: false });
                        added++;
                    }
                });
                saveToHistory();
                saveAndRender();
                showToast(`تم استيراد ${added} كرت من Excel بنجاح ✅`);
            } catch (err) {
                showToast('حدث خطأ أثناء قراءة ملف Excel ❌');
            }
            e.target.value = '';
        };
        reader.readAsBinaryString(file);
    }

    async function saveToGitHub(silent = false) {
        if (!ensureGhCredentials()) return;
        if(!silent) showToast("جاري الحفظ السحابي... ⏳");
        const jsonStr = JSON.stringify(notes, null, 2);
        const content = btoa(unescape(encodeURIComponent(jsonStr)));
        
        try {
            let sha = "";
            const getRes = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.path}`, {
                headers: { 'Authorization': `token ${GH_CONFIG.token}` }
            });
            if (getRes.ok) {
                const data = await getRes.json();
                sha = data.sha;
            }

            const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GH_CONFIG.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Cloud Backup - ${new Date().toLocaleString()}`,
                    content: content,
                    sha: sha || undefined
                })
            });

            if (res.ok) {
                if(!silent) showToast("تم الحفظ على GitHub! ☁️✅");
            } else {
                if(!silent) showToast("فشل الاتصال بـ GitHub ❌");
            }
        } catch (err) {
            if(!silent) showToast("فشل الاتصال بـ GitHub ❌");
        }
    }

    async function loadFromGitHub() {
        if (!ensureGhCredentials()) return;
        showToast("جاري جلب النسخة... ⏳");
        try {
            const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.path}`, {
                headers: { 'Authorization': `token ${GH_CONFIG.token}` }
            });
            if (res.ok) {
                const data = await res.json();
                const decoded = decodeURIComponent(escape(atob(data.content)));
                notes = JSON.parse(decoded);
                saveToHistory();
                saveAndRender(false);
                showToast("تم استرجاع الكروت سحابياً! ☁️✅");
            } else {
                showToast("فشل الاتصال بـ GitHub ❌");
            }
        } catch (err) {
            showToast("فشل الاتصال بـ GitHub ❌");
        }
    }

    function handleExport(fmt) {
        let content, name, type;
        const now = new Date();
        const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
        
        if(fmt === 'json') { 
            content = JSON.stringify(notes, null, 2); 
            name = `Aura_Backup_${timestamp}.json`; type = 'text/json'; 
        } else if(fmt === 'beef') { 
            content = JSON.stringify({combos: notes.map(n=>({keyword:n.title, snippet:n.content}))}, null, 2); 
            name = `Aura_Beef_${timestamp}.btbackup`; type = 'text/json'; 
        } else if(fmt === 'txt') {
            content = notes.map(n => `[${n.title}]\n${n.content}\n---`).join('\n\n');
            name = `Aura_Notes_${timestamp}.txt`; type = 'text/plain';
        } else if(fmt === 'csv') {
            content = "\uFEFFTitle,Content,Section\n" + notes.map(n => `"${n.title.replace(/"/g,'""')}","${n.content.replace(/"/g,'""')}","${n.main}"`).join('\n');
            name = `Aura_Sheet_${timestamp}.csv`; type = 'text/csv;charset=utf-8;';
        }

        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([content], {type}));
        a.download = name;
        a.click();
        showToast(`تم التصدير: ${name}`);
    }

        reader.readAsText(e.target.files[0]);
    }

                let stopwatchRunning = false, stopwatchElapsed = 0, stopwatchInterval = null, stopwatchStartTime = 0;
                let silentAudio = null;

                function formatTime(ms) {
                    const totalSecs = Math.floor(ms / 1000);
                    return `${String(Math.floor(totalSecs / 60)).padStart(2,'0')}:${String(totalSecs % 60).padStart(2,'0')}`;
                }

                // تحديث لون التايمر لحماية هدف AHT (7:30)
                function updateAhtVisualAlert(elapsedMs) {
                    const secs = Math.floor(elapsedMs / 1000);
                    chronoDigits.classList.remove('warn-amber', 'alert-red');
                    if (!stopwatchRunning) return;
                    if (secs >= 420) { // 7:00 دقيقة فأكثر -> إنذار أحمر
                        chronoDigits.classList.add('alert-red');
                    } else if (secs >= 330) { // 5:30 إلى 7:00 -> تنبيه أصفر
                        chronoDigits.classList.add('warn-amber');
                    }
                }

                function updateMediaSessionState() {
                    const apply = (nav) => {
                        if (!nav || !('mediaSession' in nav)) return;
                        try {
                            nav.mediaSession.playbackState = stopwatchRunning ? 'playing' : 'paused';
                            nav.mediaSession.setPositionState({
                                duration: Math.max(stopwatchElapsed / 1000 + 7200, 1),
                                playbackRate: 1,
                                position: Math.min(stopwatchElapsed / 1000, 7199)
                            });
                        } catch(e) {}
                    };
                    apply(navigator);
                    apply(pipWin.navigator);
                }

                function startStopwatch() {
                    if (stopwatchRunning) return;
                    stopwatchRunning = true;
                    chronoDigits.classList.add('active');
                    stopwatchStartTime = performance.now();
                    stopwatchInterval = pipWin.setInterval(() => {
                        stopwatchElapsed += (performance.now() - stopwatchStartTime);
                        stopwatchStartTime = performance.now();
                        chronoDigits.innerText = formatTime(stopwatchElapsed);
                        updateAhtVisualAlert(stopwatchElapsed);
                        updateMediaSessionState();
                    }, 200);
                    if (silentAudio && silentAudio.paused) silentAudio.play().catch(() => {});
                    updateMediaSessionState();
                }

                function resetStopwatch() {
                    stopwatchRunning = false;
                    if (stopwatchInterval) pipWin.clearInterval(stopwatchInterval);
                    stopwatchElapsed = 0;
                    chronoDigits.classList.remove('active', 'warn-amber', 'alert-red');
                    chronoDigits.innerText = "00:00";
                    updateMediaSessionState();
                }

                window.__agentTimerControls = {
                    start: startStopwatch,
                    reset: resetStopwatch,
                    isRunning: () => stopwatchRunning
                };

                let lastMediaActionAt = 0;
                function startOrResetStopwatch() {
                    if (!window.__agentTimerControls) return;
                    const now = Date.now();
                    if (now - lastMediaActionAt < 400) return;
                    lastMediaActionAt = now;
                    if (window.__agentTimerControls.isRunning()) window.__agentTimerControls.reset();
                    else window.__agentTimerControls.start();
                }

                chronoDigits.addEventListener('click', () => startOrResetStopwatch());

                // Hold Timer (2 دقيقة عد تنازلي مع تنبيه صوتي خفيف عند 00:15 و 00:00)
                let holdRunning = false, holdRemaining = 120 * 1000, holdInterval = null, holdStartTime = 0;
                let holdWarned15 = false;

                function renderHoldUI() {
                    chronoHoldAction.innerText = `⏳ ${formatTime(holdRemaining)}`;
                    if (holdRemaining <= 15000) {
                        chronoHoldAction.classList.add('halt');
                        if (!holdWarned15) {
                            holdWarned15 = true;
                            playGentleBeep(740, 120, 1);
                        }
                    } else {
                        chronoHoldAction.classList.remove('halt');
                    }
                }
                function resetHold() {
                    holdRunning = false;
                    holdWarned15 = false;
                    if (holdInterval) pipWin.clearInterval(holdInterval);
                    holdRemaining = 120 * 1000;
                    chronoHoldAction.className = 'hud-btn hold-btn';
                    chronoHoldAction.innerText = '⏳ 2:00';
                }
                chronoHoldAction.addEventListener('click', () => {
                    if (holdRunning) {
                        resetHold();
                    } else {
                        holdRunning = true;
                        holdWarned15 = false;
                        chronoHoldAction.className = 'hud-btn hold-btn running';
                        holdStartTime = performance.now();
                        holdInterval = pipWin.setInterval(() => {
                            holdRemaining -= (performance.now() - holdStartTime);
                            holdStartTime = performance.now();
                            if (holdRemaining <= 0) {
                                holdRemaining = 0;
                                pipWin.clearInterval(holdInterval);
                                holdRunning = false;
                                holdWarned15 = false;
                                chronoHoldAction.className = 'hud-btn hold-btn';
                                chronoHoldAction.innerText = '⏳ 2:00';
                                playGentleBeep(980, 140, 2);
                            } else {
                                renderHoldUI();
                            }
                        }, 200);
                    }
                });

                function setupMediaSession(nav) {
                    if (!nav || !('mediaSession' in nav)) return;
                    try {
                        nav.mediaSession.metadata = new MediaMetadata({
                            title: 'Agent Timer',
                            artist: 'Beef Aura Pro',
                            album: 'Support Tools'
                        });
                        nav.mediaSession.setActionHandler('play', () => startOrResetStopwatch());
                        nav.mediaSession.setActionHandler('pause', () => startOrResetStopwatch());
                        nav.mediaSession.setActionHandler('stop', () => {
                            if (window.__agentTimerControls) window.__agentTimerControls.reset();
                        });
                        updateMediaSessionState();
                    } catch(e) {}
                }
                setupMediaSession(navigator);
                setupMediaSession(pipWin.navigator);

                try {
                    const silentWav = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                    silentAudio = new Audio(silentWav);
                    silentAudio.loop = true;
                    silentAudio.volume = 0.001;
                    silentAudio.play().catch(() => {});
                } catch(e) {}

                function handleMediaKey(e) {
                    const k = e.key;
                    if (k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause') {
                        e.preventDefault();
                        startOrResetStopwatch();
                    } else if (k === 'MediaStop') {
                        e.preventDefault();
                        if (window.__agentTimerControls) window.__agentTimerControls.reset();
                    }
                }
                pipDoc.addEventListener('keydown', handleMediaKey);
                document.addEventListener('keydown', handleMediaKey);

                // لقطة شاشة نظيفة JPG
                chronoSnapAction.addEventListener('click', async () => {
                    try {
                        if (!targetDirHandle && ('showDirectoryPicker' in pipWin || 'showDirectoryPicker' in window)) {
                            const picker = pipWin.showDirectoryPicker || window.showDirectoryPicker;
                            targetDirHandle = await picker({ id: 'attach_folder', mode: 'readwrite' }).catch(() => null);
                        }
                        if (!activeDisplayStream || !activeDisplayStream.active) {
                            activeDisplayStream = await pipWin.navigator.mediaDevices.getDisplayMedia({
                                video: { displaySurface: "monitor" },
                                audio: false,
                                monitorTypeSurfaces: "include",
                                surfaceSwitching: "exclude"
                            });
                            const track = activeDisplayStream.getVideoTracks()[0];
                            activeImageCapture = new ImageCapture(track);
                            track.addEventListener('ended', () => {
                                activeDisplayStream = null;
                                activeImageCapture = null;
                            });
                        }
                        pipDoc.body.style.opacity = '0';
                        await new Promise(r => pipWin.setTimeout(r, 200));
                        const bitmap = await activeImageCapture.grabFrame();
                        pipDoc.body.style.opacity = '1';

                        const canvas = pipDoc.createElement('canvas');
                        canvas.width = bitmap.width;
                        canvas.height = bitmap.height;
                        canvas.getContext('2d').drawImage(bitmap, 0, 0);

                        canvas.toBlob(async (blob) => {
                            const fileName = `Full_Screen_${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.jpg`;
                            if (targetDirHandle) {
                                try {
                                    const fileHandle = await targetDirHandle.getFileHandle(fileName, { create: true });
                                    const writable = await fileHandle.createWritable();
                                    await writable.write(blob);
                                    await writable.close();
                                    return;
                                } catch(e) {}
                            }
                            const link = pipDoc.createElement('a');
                            link.href = URL.createObjectURL(blob);
                            link.download = fileName;
                            link.click();
                        }, 'image/jpeg', 0.92);
                    } catch(err) {
                        pipDoc.body.style.opacity = '1';
                        activeDisplayStream = null;
                        activeImageCapture = null;
                    }
                });

                // شارة تبديل الوضع داخل PiP متزامنة مع الصفحة الرئيسية
                let pipDebounce = null;
                hudAutoBadge.className = 'hud-autotag ' + (AUTO_COPY_MODE ? '' : 'off');
                hudAutoBadge.innerText = AUTO_COPY_MODE ? '⚡ Auto' : (currentLang === 'ar' ? '✋ عادي' : '✋ Manual');
                hudAutoBadge.addEventListener('click', () => {
                    toggleWorkMode();
                });

                async function copyFromPip(text) {
                    const resolved = resolveSmartPlaceholders(text, hudVarInput.value);
                    try {
                        await pipWin.navigator.clipboard.writeText(resolved);
                    } catch(e) {}
                    copyTotal++;
                    localStorage.setItem('aura_copy_counter_26', copyTotal);
                    document.getElementById('stat-copies').innerText = copyTotal;
                }

                // شريط الاختصارات السريعة (Quick Flow Macros من الكروت المثبتة أو الأحدث)
                function renderHudMacros() {
                    const pinnedNotes = notes.filter(n => n.pinned);
                    const quickList = pinnedNotes.length ? pinnedNotes : notes.slice(0, 6);
                    hudMacroStrip.innerHTML = '';
                    if (!quickList.length) {
                        hudMacroStrip.style.display = 'none';
                        return;
                    }
                    hudMacroStrip.style.display = 'flex';
                    quickList.forEach(item => {
                        const pill = pipDoc.createElement('button');
                        pill.className = 'hud-macro-pill';
                        pill.innerText = item.title;
                        pill.title = item.content;
                        pill.addEventListener('click', () => {
                            copyFromPip(item.content);
                            pill.classList.add('copied');
                            pipWin.setTimeout(() => pill.classList.remove('copied'), 500);
                        });
                        hudMacroStrip.appendChild(pill);
                    });
                }
                pipWin.__refreshHudMacros = renderHudMacros;
                renderHudMacros();

                // قائمة الاقتراحات الحية والتنقل بالأسهم داخل PiP
                let suggestMatches = [];
                let selectedSuggestIdx = -1;

                function hideSuggestions() {
                    hudSuggestList.classList.remove('show');
                    hudSuggestList.innerHTML = '';
                    suggestMatches = [];
                    selectedSuggestIdx = -1;
                }

                function renderSuggestions(rawVal) {
                    const q = normalizeKey(rawVal);
                    if (!q) { hideSuggestions(); return; }
                    suggestMatches = notes.filter(n =>
                        normalizeKey(n.title).includes(q) || n.content.toLowerCase().includes(rawVal.toLowerCase())
                    ).slice(0, 5);

                    if (!suggestMatches.length) { hideSuggestions(); return; }
                    selectedSuggestIdx = 0;
                    hudSuggestList.innerHTML = '';
                    suggestMatches.forEach((m, idx) => {
                        const row = pipDoc.createElement('div');
                        row.className = 'hud-suggest-item' + (idx === 0 ? ' selected' : '');
                        row.innerHTML = `<span class="hud-suggest-key">${m.title}</span><span class="hud-suggest-prev">${m.content}</span>`;
                        row.addEventListener('click', () => {
                            copyFromPip(m.content);
                            hudSearchInput.value = '';
                            hideSuggestions();
                        });
                        hudSuggestList.appendChild(row);
                    });
                    hudSuggestList.classList.add('show');
                }

                function highlightSuggestRow() {
                    const items = hudSuggestList.querySelectorAll('.hud-suggest-item');
                    items.forEach((el, idx) => el.classList.toggle('selected', idx === selectedSuggestIdx));
                }

                hudSearchInput.addEventListener('input', () => {
                    if (pipDebounce) pipWin.clearTimeout(pipDebounce);
                    const rawVal = hudSearchInput.value.trim();
                    const searchVal = normalizeKey(rawVal);
                    if (!rawVal) {
                        hideSuggestions();
                        if (!AUTO_COPY_MODE) {
                            document.getElementById('searchInput').value = '';
                            render();
                        }
                        return;
                    }

                    renderSuggestions(rawVal);

                    if (AUTO_COPY_MODE && searchVal.length > 0) {
                        pipDebounce = pipWin.setTimeout(() => {
                            const match = notes.find(i => normalizeKey(i.title) === searchVal);
                            if (match && normalizeKey(hudSearchInput.value) === normalizeKey(match.title)) {
                                copyFromPip(match.content);
                                hudSearchInput.value = '';
                                hideSuggestions();
                            }
                        }, 450);
                    } else {
                        document.getElementById('searchInput').value = rawVal;
                        render();
                    }
                });

                hudSearchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowDown' && suggestMatches.length) {
                        e.preventDefault();
                        selectedSuggestIdx = (selectedSuggestIdx + 1) % suggestMatches.length;
                        highlightSuggestRow();
                    } else if (e.key === 'ArrowUp' && suggestMatches.length) {
                        e.preventDefault();
                        selectedSuggestIdx = (selectedSuggestIdx - 1 + suggestMatches.length) % suggestMatches.length;
                        highlightSuggestRow();
                    } else if (e.key === 'Escape') {
                        hideSuggestions();
                    } else if (e.key === 'Enter') {
                        const rawVal = hudSearchInput.value.trim();
                        const searchVal = normalizeKey(rawVal);
                        const exactMatch = notes.find(i => normalizeKey(i.title) === searchVal);
                        const chosen = exactMatch || (selectedSuggestIdx >= 0 ? suggestMatches[selectedSuggestIdx] : null);
                        if (chosen) {
                            if (pipDebounce) pipWin.clearTimeout(pipDebounce);
                            copyFromPip(chosen.content);
                            hudSearchInput.value = '';
                            hideSuggestions();
                        }
                    }
                });

                pipWin.addEventListener('unload', () => {
                    pipWin.clearInterval(clockInterval);
                    if (stopwatchInterval) pipWin.clearInterval(stopwatchInterval);
                    if (holdInterval) pipWin.clearInterval(holdInterval);
                    if (activeDisplayStream) activeDisplayStream.getTracks().forEach(t => t.stop());
                    if (silentAudio) { silentAudio.pause(); silentAudio = null; }
                    document.removeEventListener('keydown', handleMediaKey);
                    window.__agentTimerControls = null;
                    activePipWin = null;
                });

                return;
            } catch(err) {}
        }
        showToast("يرجى استخدام متصفح Google Chrome محدّث للوضع العائم المستقل");
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeModal(); closePopup(); if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar(); }
        if (e.altKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); openModal(); }
        if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { if (document.getElementById('modal').style.display === 'flex') { e.preventDefault(); saveNote(); } }
    });

    initGhInputs();
    applyLanguage();
</script>
